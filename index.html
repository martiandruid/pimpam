<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Progresión Postquirúrgica en Fisioterapia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <main class="max-w-4xl mx-auto space-y-6">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-sky-400">Verificación Postquirúrgica & Análisis de Fallos</h1>
      <p class="text-slate-400 text-sm mt-1">GPC - Módulo de Control Clínico y Progresión de Intervenciones</p>
    </header>

    <!-- Selector de Intervención -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700">
      <label for="select-cirugia" class="block text-sm font-medium text-slate-300 mb-2">Seleccionar Intervención Quirúrgica / Fase:</label>
      <select id="select-cirugia" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-200 focus:ring-2 focus:ring-sky-500 outline-none">
        <option value="">-- Cargar intervención --</option>
      </select>
    </section>

    <!-- Lista de Chequeo Dinámica -->
    <section id="checklist-container" class="space-y-4 hidden">
      <h2 class="text-lg font-semibold text-slate-200">Ítems de Verificación de Objetivos</h2>
      <div id="items-list" class="space-y-3"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
